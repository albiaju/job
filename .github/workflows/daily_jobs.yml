name: Daily Job Scraper & Digest

on:
  schedule:
    # 7:00 AM IST = 01:30 AM UTC (IST is UTC + 5:30)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows running manually on demand

jobs:
  scrape_and_email:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Job Scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          python send_daily_jobs.py --now

      - name: Upload HTML Preview as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-jobs-digest
          path: daily_jobs_preview.html
          retention-days: 7
